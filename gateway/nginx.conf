events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Railway private networking hands out a new internal IP on every redeploy.
    # A literal `proxy_pass http://api.railway.internal:8000` resolves DNS once at
    # startup and caches that address forever, so after any upstream redeploy nginx
    # keeps dialling a dead IP and the gateway answers 504.
    #
    # Two mitigations, both required:
    #   1. resolve through Railway's DNS resolver with a short TTL;
    #   2. proxy_pass a *variable*, which makes nginx resolve per request instead
    #      of caching. Variable proxy_pass drops automatic URI rewriting, so the
    #      path prefixes are stripped with explicit `rewrite` rules.
    resolver [fd12::10] valid=5s ipv6=off;

    server {
        listen ${PORT};

        client_max_body_size 32m;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Session refresh can emit a large Set-Cookie header; raise the upstream
        # proxy buffers so auth responses do not overflow the nginx defaults.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 16k;

        # Railway healthcheck target. Served by nginx itself and never proxied, so
        # the public entrypoint reports healthy even while an upstream is still
        # rolling out.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        location = /services {
            return 308 /services/;
        }

        location /api/ {
            set $api_upstream "${AGENTA_API_UPSTREAM}";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /services/ {
            set $services_upstream "${AGENTA_SERVICES_UPSTREAM}";
            rewrite ^/services/(.*)$ /$1 break;
            proxy_pass http://$services_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The mobile app is BUILT with basePath "/m", so it owns the prefix and it
        # must NOT be stripped. This regex matches /m and /m/... but not /mobile,
        # and a regex location always outranks the `/` catch-all below.
        location ~ ^/m(/|$) {
            set $web_mobile_upstream "${AGENTA_WEB_MOBILE_UPSTREAM}";
            proxy_pass http://$web_mobile_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $web_upstream "${AGENTA_WEB_UPSTREAM}";
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
